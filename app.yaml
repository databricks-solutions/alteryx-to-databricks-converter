command:
  - "python"
  - "-c"
  - "import os; import uvicorn; uvicorn.run('server.main:app', host='0.0.0.0', port=int(os.environ.get('PORT', '8000')))"
env:
  - name: "A2D_CORS_ORIGINS"
    value: '["*"]'
  - name: "PYTHONPATH"
    value: "src:."
  - name: "A2D_DB_BACKEND"
    value: "lakebase"
  # IMPORTANT — this file is the source of truth for the app's environment.
  #
  # A deployed `app.yaml` SHADOWS `resources.apps.<app>.config.env` in
  # databricks.yml: the Apps runtime reads this file, so anything declared only
  # in the bundle (including values passed via `--var`) never reaches the app.
  # That silently disabled both Lakebase history and the AI assistant on a real
  # deploy, so the values live here instead. Keep the two in sync, or delete the
  # `config.env` block in databricks.yml to avoid the ambiguity.

  # AI migration assistant — OPT-IN. Empty means no model is ever called and the
  # /chat page shows a setup hint instead. The assistant is advisory only: it
  # never modifies generated code.
  - name: "A2D_FMAPI_ENDPOINT"
    value: "https://fevm-alteryx-to-dbx-converter.cloud.databricks.com/serving-endpoints/databricks-claude-opus-5/invocations"

  # Lakebase (Autoscaling Postgres) — conversion history. PGPORT/PGSSLMODE fall
  # back to sane defaults in server/settings.py; PGUSER falls back to
  # DATABRICKS_CLIENT_ID, which is the app's service principal.
  - name: "A2D_LAKEBASE_ENDPOINT"
    value: "projects/a2d-lakebase-autoscale/branches/production/endpoints/primary"
  - name: "PGHOST"
    value: "ep-shiny-art-d2ooiahz.database.us-east-1.cloud.databricks.com"
  - name: "PGDATABASE"
    value: "databricks_postgres"
