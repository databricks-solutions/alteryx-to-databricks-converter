# Databricks Apps runtime manifest.
#
# IMPORTANT — this file is the ONLY source of truth for the app's environment.
# A deployed `app.yaml` SHADOWS `resources.apps.<app>.config` in databricks.yml:
# the Apps runtime reads this file, so anything declared only in the bundle
# (including values passed via `--var` at deploy time) never reaches the app.
# databricks.yml therefore declares no `config:` block — see the note there.
#
# Deployment-specific values are intentionally NOT committed here. Every value
# below is either non-sensitive or empty by default; set the empty ones for your
# own workspace with `databricks apps update` / the Apps UI, or by adding a
# `config.env` block in a private overlay. Committing a workspace hostname makes
# the repo non-portable and, for the FMAPI endpoint, would silently enable AI for
# everyone who clones it.
command:
  - "python"
  - "-c"
  # Bind the port the Apps runtime asks for. DATABRICKS_APP_PORT is the runtime's
  # own variable; PORT and 8000 are fallbacks so `make serve` and older runtimes
  # keep working.
  - "import os; import uvicorn; uvicorn.run('server.main:app', host='0.0.0.0', port=int(os.environ.get('DATABRICKS_APP_PORT') or os.environ.get('PORT') or 8000))"

env:
  - name: "PYTHONPATH"
    value: "src:."

  # The SPA is served by this same app, so browser requests are same-origin and
  # need no CORS at all. Left empty in production; `make serve` adds localhost
  # origins for Vite dev via server/settings.py defaults.
  - name: "A2D_CORS_ORIGINS"
    value: '[]'

  # --- Saved projects (optional) -----------------------------------------
  # Empty backend = no database: projects live in the browser tab, and the app
  # says so at startup. To enable
  # Lakebase, set A2D_DB_BACKEND=lakebase plus A2D_LAKEBASE_ENDPOINT / PGHOST /
  # PGDATABASE for YOUR workspace, and grant the app's service principal a
  # Postgres role on the target branch.
  - name: "A2D_DB_BACKEND"
    value: ""
  - name: "A2D_LAKEBASE_ENDPOINT"
    value: ""
  - name: "PGHOST"
    value: ""
  - name: "PGDATABASE"
    value: "databricks_postgres"

  # --- AI completion (OPT-IN) --------------------------------------------
  # MUST stay empty in source control. a2d calls no language model unless an
  # operator sets this to a Foundation Model API invocations URL — that is a
  # product rule, not a default. Empty means /api/ai/status reports disabled
  # and the AI completion step says it isn't turned on.
  - name: "A2D_FMAPI_ENDPOINT"
    value: ""

  # --- AI tracing (OPT-IN) -----------------------------------------------
  # An MLflow experiment path (or id) in this workspace. When set, every AI
  # completion and Review suggestion is logged as a trace (prompt, reply,
  # check result, time, tokens) and a reviewer's use / edit / discard of a
  # suggestion as feedback on it. Link the experiment to Unity Catalog (an App
  # can't reach the storage plain experiments use for spans):
  # scripts/setup_ai_tracing.py creates it and grants the app's service
  # principal. Prompts carry workflow configuration (credentials masked), so
  # share it only with the people who should see it. Empty means no tracing.
  - name: "A2D_MLFLOW_EXPERIMENT"
    value: ""
